name: Build and Cache

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

env:
  NIX_EXTRA_CONF: |
    substituters = https://cache.nixos.org/ https://nix-community.cachix.org https://robot-disco.cachix.org
    trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= robot-disco.cachix.org-1:UOaR4+SF1stx8O/Z+bJD9ENNjumfabRNRvCnjwct0sg=

jobs:
  build-systems:
    strategy:
      matrix:
        include:
          - system: arrakis
            runner: ubuntu-latest
            target: .#nixosConfigurations.arrakis.config.system.build.toplevel
          - system: fountain-of-ahmed-iii
            runner: macos-latest
            target: .#darwinConfigurations.fountain-of-ahmed-iii.system
          - system: darktower
            runner: ubuntu-latest
            target: .#nixosConfigurations.darktower.config.system.build.toplevel
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    steps:
      # See https://dev.to/mathio/squeezing-disk-space-from-github-actions-runners-an-engineers-guide-3pjg
      - name: Free up disk space by removing unnecessary tooling
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: robot-disco
          authToken: '${{ secrets.CACHIX_KEY }}'
      
      - name: Build system configuration for ${{ matrix.system }}
        run: |
          nix build ${{ matrix.target }} --print-build-logs

  build-packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - sunsama
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}
      
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: robot-disco
          authToken: '${{ secrets.CACHIX_KEY }}'
      
      - name: Build package ${{ matrix.package }}
        run: |
          nix build .#packages.x86_64-linux.${{ matrix.package }} --print-build-logs

  build-dev-shells:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}
      
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: robot-disco
          authToken: '${{ secrets.CACHIX_KEY }}'
      
      - name: Build development shell
        run: |
          nix develop --command echo "Development shell built successfully"
